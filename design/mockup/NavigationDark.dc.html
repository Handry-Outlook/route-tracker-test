<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #e9edf2; font-family: Inter, -apple-system, "SF Pro Text", system-ui, sans-serif; color: #e7edf5; -webkit-font-smoothing: antialiased; }
    a { color: #4a9bff; } a:hover { color: #ffa451; }
    * { box-sizing: border-box; }
    .phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: #0e1620; color: #e7edf5; }
    .safe { padding-top: 54px; }
    h1, h2, h3, p { margin: 0; }
    .card { background: #161f2b; border: 1px solid #243244; border-radius: 16px; box-shadow: 0 4px 14px #00000040; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #243244; background: #161f2b; font-size: 13px; font-weight: 600; color: #e7edf5; white-space: nowrap; }
    .chip.on { background: #0c1e30; border-color: #0c1e30; color: #fff; }
    .chip.orange { background: #ffa451; border-color: #ffa451; color: #fff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 15px; border: 0; }
    .btn.primary { background: #4a9bff; color: #fff; }
    .btn.cta { background: #ffa451; color: #fff; box-shadow: 0 8px 22px #ffa45155; }
    .btn.ghost { background: #161f2b; border: 1px solid #243244; color: #e7edf5; }
    .iconbtn { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: #161f2b; border: 1px solid #243244; color: #e7edf5; box-shadow: 0 4px 14px #00000040; }
    .muted { color: #93a3b8; }
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 8px 20px; background: #161f2b; border-top: 1px solid #243244; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 600; color: #93a3b8; border-radius: 12px; }
    .tab.on { color: #4a9bff; }
    .tab.rec { color: #ffa451; }
    .tab.rec svg { width: 30px; height: 30px; }
    .searchbar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 999px; background: #161f2b; box-shadow: 0 12px 34px #00000055; color: #93a3b8; font-size: 15px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.blue { background: #e5efff; color: #1754a3; }
    .badge.orange { background: #fff0e1; color: #a35400; }
    .badge.green { background: #e3f7ee; color: #0d6b47; }
    .badge.red { background: #fde5e5; color: #a82525; }
    .badge.dark { background: #132238cc; color: #fff; backdrop-filter: blur(6px); }
    .stat b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
    .stat small { font-size: 11px; color: #93a3b8; font-weight: 600; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #161f2b; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px #10233d30; padding: 8px 16px 16px; }
    .handle { width: 40px; height: 5px; border-radius: 999px; background: #243244; margin: 0 auto 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .hscroll { display: flex; gap: 12px; overflow: hidden; }
    .section-title { font-size: 15px; font-weight: 800; }
    .toggle { width: 46px; height: 28px; border-radius: 999px; background: #243244; position: relative; }
    .toggle.on { background: #2fce8f; }
    .toggle i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
    .toggle.on i { left: 21px; }
    .slider { position: relative; height: 32px; }
    .slider .track { position: absolute; left: 0; right: 0; top: 14px; height: 4px; border-radius: 999px; background: #243244; }
    .slider .fill { position: absolute; left: 0; top: 14px; height: 4px; border-radius: 999px; background: #4a9bff; }
    .slider .knob { position: absolute; top: 5px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #4a9bff; box-shadow: 0 4px 14px #00000040; }
  </style>
</helmet>
