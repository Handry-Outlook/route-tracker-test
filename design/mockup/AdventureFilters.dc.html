<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #e9edf2; font-family: Inter, -apple-system, "SF Pro Text", system-ui, sans-serif; color: #132238; -webkit-font-smoothing: antialiased; }
    a { color: #176bdb; } a:hover { color: #f28b30; }
    * { box-sizing: border-box; }
    .phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: #f5f7fa; color: #132238; }
    .safe { padding-top: 54px; }
    h1, h2, h3, p { margin: 0; }
    .card { background: #ffffff; border: 1px solid #dbe2ea; border-radius: 16px; box-shadow: 0 4px 14px #10233d18; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #dbe2ea; background: #ffffff; font-size: 13px; font-weight: 600; color: #132238; white-space: nowrap; }
    .chip.on { background: #15324d; border-color: #15324d; color: #fff; }
    .chip.orange { background: #f28b30; border-color: #f28b30; color: #fff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 15px; border: 0; }
    .btn.primary { background: #176bdb; color: #fff; }
    .btn.cta { background: #f28b30; color: #fff; box-shadow: 0 8px 22px #f28b3055; }
    .btn.ghost { background: #ffffff; border: 1px solid #dbe2ea; color: #132238; }
    .iconbtn { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #dbe2ea; color: #132238; box-shadow: 0 4px 14px #10233d18; }
    .muted { color: #657186; }
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 8px 20px; background: #ffffff; border-top: 1px solid #dbe2ea; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 600; color: #657186; border-radius: 12px; }
    .tab.on { color: #176bdb; }
    .tab.rec { color: #f28b30; }
    .tab.rec svg { width: 30px; height: 30px; }
    .searchbar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 999px; background: #ffffff; box-shadow: 0 12px 34px #10233d25; color: #657186; font-size: 15px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.blue { background: #e5efff; color: #1754a3; }
    .badge.orange { background: #fff0e1; color: #a35400; }
    .badge.green { background: #e3f7ee; color: #0d6b47; }
    .badge.red { background: #fde5e5; color: #a82525; }
    .badge.dark { background: #132238cc; color: #fff; backdrop-filter: blur(6px); }
    .stat b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
    .stat small { font-size: 11px; color: #657186; font-weight: 600; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px #10233d30; padding: 8px 16px 16px; }
    .handle { width: 40px; height: 5px; border-radius: 999px; background: #dbe2ea; margin: 0 auto 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .hscroll { display: flex; gap: 12px; overflow: hidden; }
    .section-title { font-size: 15px; font-weight: 800; }
    .toggle { width: 46px; height: 28px; border-radius: 999px; background: #dbe2ea; position: relative; }
    .toggle.on { background: #139b66; }
    .toggle i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
    .toggle.on i { left: 21px; }
    .slider { position: relative; height: 32px; }
    .slider .track { position: absolute; left: 0; right: 0; top: 14px; height: 4px; border-radius: 999px; background: #dbe2ea; }
    .slider .fill { position: absolute; left: 0; top: 14px; height: 4px; border-radius: 999px; background: #176bdb; }
    .slider .knob { position: absolute; top: 5px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #176bdb; box-shadow: 0 4px 14px #10233d18; }
  </style>
</helmet>

<div class="phone">
  <svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" style="display:block;position:absolute;inset:0"><defs><linearGradient id="gr" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f28b30"/><stop offset="1" stop-color="#176bdb"/></linearGradient></defs>
    <rect width="390" height="844" fill="#eaeee7"/>
    <path d="M-20 120 C 80 90, 140 160, 220 120 S 380 60, 420 110 L 420 -10 L -20 -10z" fill="#d5e6c6"/>
    <path d="M150 300 c 60 -30 140 -10 180 30 c 30 30 20 90 -30 110 c -70 30 -160 0 -170 -50 c -5 -40 0 -70 20 -90z" fill="#d5e6c6"/>
    <path d="M-20 560 c 60 20 90 80 60 140 c -20 40 -60 60 -60 60z" fill="#d5e6c6"/>
    <path d="M-20 400 C 60 380, 100 430, 140 470 S 200 560, 240 600 S 330 700, 420 690 L 420 760 C 330 760, 250 680, 200 640 S 110 520, 60 480 S -20 450, -20 450z" fill="#c6dcf1"/>
    <g stroke="#f6f7f3" stroke-width="3" fill="none"><path d="M0 200 L390 240M0 330 L390 300M40 0 L60 844M300 0 L280 844M120 0 L110 844"/></g>
    <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"><path d="M0 260 C 100 250, 200 280, 390 250"/><path d="M200 0 C 210 200, 180 400, 210 844"/><path d="M0 700 C 120 660, 260 720, 390 690"/></g>
    <g font-family="Inter, system-ui" font-size="11" font-weight="600" fill="#7b8794"><text x="230" y="105">Ashton Court</text><text x="60" y="380">Bedminster</text><text x="250" y="330">Clifton</text><text x="120" y="770">Long Ashton</text></g>
    
    
    
    
    
    
  </svg>
  <div style="position:absolute;inset:0;background:#10233d66"></div>
  <div class="sheet" style="height:640px;display:flex;flex-direction:column;gap:18px">
    <div class="handle"></div>
    <div class="between"><h2 style="font-size:20px;font-weight:800">Filters</h2><span class="muted" style="font-size:13px;font-weight:700">Reset</span></div>
    <div><p class="section-title" style="margin-bottom:8px">Ride type</p><div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:6px;padding:4px;background:#f5f7fa;border-radius:12px"><div style="height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#ffffff;box-shadow:0 4px 14px #10233d18">Road</div><div style="height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#657186">Gravel</div><div style="height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#657186">MTB</div></div></div>
    <div><div class="between" style="margin-bottom:6px"><span class="section-title">Duration</span><b style="color:#176bdb">2h 30m</b></div><div class="slider"><div class="track"></div><div class="fill" style="width:52%"></div><div class="knob" style="left:calc(52% - 11px)"></div></div><div class="between muted" style="font-size:11px;font-weight:600"><span>1h</span><span>5h+</span></div></div>
    <div><p class="section-title" style="margin-bottom:8px">Difficulty</p><div class="row" style="gap:8px"><span class="chip">Easy</span><span class="chip on">Moderate</span><span class="chip">Hard</span></div></div>
    <div class="between card" style="padding:12px 14px;box-shadow:none"><div><b style="font-size:14px;display:block">Round trip</b><span class="muted" style="font-size:12px;font-weight:600">Loop back to where you start</span></div><div class="toggle on"><i></i></div></div>
    <div><p class="section-title" style="margin-bottom:8px">Scenery</p><div style="display:flex;flex-wrap:wrap;gap:8px"><span class="chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>Coastal</span><span class="chip on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19c3-4 6-7 10-9"/></svg>Forest</span><span class="chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg>Mountain</span><span class="chip on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 18h16M6 14a6 6 0 0 1 12 0M12 4v2M5 8l1.5 1.5M19 8l-1.5 1.5"/></svg>Countryside</span></div></div>
    <div style="margin-top:auto" class="btn cta">Show 14 routes</div>
  </div>
</div></x-dc>
</body>
</html>
