<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Handry Outlook</title><link rel="manifest" href="manifest.json"><link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet"><link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div id="app"><nav id="nav"><div class="brand"><img src="icon.png"><b>Handry</b></div></nav><main id="map-wrap"><div id="map"></div><canvas id="wind"></canvas><aside id="panel"></aside><div class="tools"><button id="locate">◎</button><button id="weather" title="Weather">☔</button><button id="map-style" title="Map style">◫</button></div><section id="nav-guidance" hidden><div id="nav-lane"></div><div class="nav-main"><div id="nav-arrow">↑</div><div><b id="nav-instruction">Continue</b><span id="nav-next-distance"></span></div></div><div class="nav-trip"><span id="nav-remaining"></span><span id="nav-eta"></span></div><div class="navigation-colour-key"><span><i class="now"></i>Next section</span><span><i class="later"></i>Later</span><span><i class="far"></i>Farther ahead</span><span><i class="done"></i>Travelled</span></div></section><section id="quick-nav" hidden><button id="quick-start">▶ Navigation and record now</button><div id="ride-live" hidden><div class="live-metrics"><div><b id="live-speed">0.0</b><small id="live-speed-label">current km/h</small></div><div><b id="live-distance">0.00</b><small>km travelled</small></div><div><b id="live-gain">0</b><small>m elevation</small></div><div><b id="live-time">00:00</b><small>moving time</small></div></div><div class="record-buttons"><button id="pause-recording">Pause recording</button><button id="pause-navigation">Pause navigation</button></div><div class="end-action-buttons"><button id="end-recording" hidden>End recording</button><button id="end-navigation" hidden>End navigation</button></div></div></section><button id="route-undo" hidden>↶ Undo route edit</button><div id="toast"></div></main></div><script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script><script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script type="module" src="app.js"></script></body></html>
